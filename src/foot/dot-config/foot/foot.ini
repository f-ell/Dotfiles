# vim: ft=dosini

font=Ellograph CF Demi Bold:size=13,Symbols Nerd Font Mono:size=9
font-bold=Ellograph CF Heavy:size=13,Symbols Nerd Font Mono:size=9
font-italic=Ellograph CF Demi Bold:size=13:style=Italic,Symbols Nerd Font Mono:size=9
font-bold-italic=Ellograph CF Heavy:size=13:style=Italic,Symbols Nerd Font Mono:size=9
font-size-adjustment=1

letter-spacing=0.05
dpi-aware=yes

initial-window-size-pixels=800x600
initial-window-mode=windowed
pad=0x0 center

initial-color-theme=light
underline-offset=2

[scrollback]
lines=16000
multiplier=8.0
indicator-format=line

[cursor]
style=underline
blink=yes
blink-rate=700
underline-thickness=2

[mouse]
hide-when-typing=yes

[colors-dark]
background=323c41
foreground=e0dbd0
cursor=2a353b d3c6aa
# scrollback-indicator=2a353b 7fbbb3
scrollback-indicator=3c464b 3a94c5

## Normal/regular colors (color palette 0-7)
regular0=2a353b  # black
regular1=e67e80  # red
regular2=a7c080  # green
regular3=dbbc7f  # yellow
regular4=7fbbb3  # blue
regular5=d699b6  # magenta
regular6=83c092  # cyan
regular7=e8e0cc  # white

## Bright colors (color palette 8-15)
bright0=859289   # bright black
bright1=f85552   # bright red
bright2=8da101   # bright green
bright3=dfa000   # bright yellow
bright4=3a94c5   # bright blue
bright5=df69ba   # bright magenta
bright6=35a77c   # bright cyan
bright7=fdf6e3   # bright white

urls=3a94c6

[colors-light]
background=eae7d7
foreground=3c464b
cursor=d3c6aa 2a353b
scrollback-indicator=3c464b 3a94c5

## Normal/regular colors (color palette 0-7)
regular0=827a74  # black
regular1=f85552  # red
regular2=8da101  # green
regular3=dfa000  # yellow
regular4=3a94c5  # blue
regular5=df69ba  # magenta
